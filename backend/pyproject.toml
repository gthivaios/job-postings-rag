[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.142.2",
    "langchain-huggingface>=1.2.2",
    "litellm>=1.104.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "tenacity>=9.1.4",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.18.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
